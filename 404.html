<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicFix – Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages redirection fix
      const path = window.location.pathname;
      const repo = '/Community_Issue_Reporting_System/';
      if (path.startsWith(repo)) {
        sessionStorage.setItem('redirect', path.slice(repo.length));
      }
      window.location.replace(repo);
    </script>
  </head>
  <body>
    <p>Redirecting to CivicFix...</p>
  </body>
</html>
